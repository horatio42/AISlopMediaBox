name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts && npm rebuild better-sqlite3 --foreground-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: npm test
      - name: Build container
        run: docker build -t aislopmediabox:ci .
